services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: wispi-backend:dev

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: wispi-backend:dev
    ports:
      - "8000:8000"

  web:
    profiles:
      - prod-like

  frontend:
    image: node:22-alpine
    container_name: wispi-frontend
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      DEV_API_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./aq_frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
