services:
  db:
    image: postgres:16-alpine
    container_name: wispi-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wispi}
      POSTGRES_USER: ${POSTGRES_USER:-wispi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: wispi-backend
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: wispi-web
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  pg_data: