services:
  db:
    image: postgres:16-alpine
    container_name: wispi-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wispi}
      POSTGRES_USER: ${POSTGRES_USER:-wispi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wispi} -d ${POSTGRES_DB:-wispi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: ghcr.io/vulpinealicia/wispi-backend:latest
    container_name: wispi-migrate
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  backend:
    image: ghcr.io/vulpinealicia/wispi-backend:latest
    container_name: wispi-backend
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ghcr.io/vulpinealicia/wispi-web:latest
    container_name: wispi-web
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  pg_data:
