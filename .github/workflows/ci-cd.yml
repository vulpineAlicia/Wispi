name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────
  # Frontend: lint + build
  # ─────────────────────────────────────────
  frontend-ci:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: aq_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: aq_frontend

      - name: Lint
        run: npm run lint
        working-directory: aq_frontend

      - name: Build
        run: npm run build
        working-directory: aq_frontend

  # ─────────────────────────────────────────
  # Frontend: tests
  # ─────────────────────────────────────────
  frontend-tests:
    name: Frontend — tests
    runs-on: ubuntu-latest
    needs: frontend-ci
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: aq_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: aq_frontend

      - name: Test
        run: npm test
        working-directory: aq_frontend

  # ─────────────────────────────────────────
  # Backend: lint
  # ─────────────────────────────────────────
  backend-lint:
    name: Backend — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install ruff and pip-audit
        run: pip install ruff pip-audit

      - name: Lint
        run: ruff check aq_backend/

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  # ─────────────────────────────────────────
  # Backend: tests
  # ─────────────────────────────────────────
  backend-tests:
    name: Backend — tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v

  # ─────────────────────────────────────────
  # Build & push Docker images to GHCR
  # ─────────────────────────────────────────
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [frontend-ci, frontend-tests, backend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ghcr.io/vulpinealicia/wispi-web:latest

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ghcr.io/vulpinealicia/wispi-backend:latest

  # ─────────────────────────────────────────
  # Deploy (only on push to main, all CI green)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            git fetch origin
            git reset --hard origin/main
            docker compose pull
            docker compose up -d
