name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # Frontend: lint + build
  # ─────────────────────────────────────────
  frontend-ci:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aq_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: aq_frontend

      - name: Lint
        run: npm run lint
        working-directory: aq_frontend

      - name: Build
        run: npm run build
        working-directory: aq_frontend

  # ─────────────────────────────────────────
  # Frontend: tests
  # ─────────────────────────────────────────
  frontend-tests:
    name: Frontend — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aq_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: aq_frontend

      - name: Test
        run: npm test
        working-directory: aq_frontend

  # ─────────────────────────────────────────
  # Backend: lint
  # ─────────────────────────────────────────
  backend-lint:
    name: Backend — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check aq_backend/

  # ─────────────────────────────────────────
  # Backend: tests
  # ─────────────────────────────────────────
  backend-tests:
    name: Backend — tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v

  # ─────────────────────────────────────────
  # Deploy (only on push to main, all CI green)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [frontend-ci, frontend-tests, backend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            git pull origin main
            docker compose up --build -d
